name: probe-token

# One-off validation: can a GitHub-hosted runner (Azure datacenter IP) mint the
# Aliyun anti-bot token through `csair auth`, or does the WAF hard-block it?
# This gates the real monitor. Run it a few times across different hours via the
# Actions tab ("Run workflow"). It NEVER fails the job — read the logs to decide.

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Origin airport"
        default: "SFO"
      to:
        description: "Destination airport"
        default: "CAN"
      date:
        description: "Departure date(s) YYYY-MM-DD, comma-separated (blank = 21 days from today)"
        default: ""
      capture:
        description: "Also record the requests CZ's own booking page sends (csair debug capture)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Resolve Chrome
        run: |
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          [ -n "$CHROME" ] || CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser)"
          echo "CSAIR_CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Build
        run: go build -o csair .

      - name: Probe auth + search (never fails the job)
        env:
          PROBE_FROM: ${{ inputs.from }}
          PROBE_TO: ${{ inputs.to }}
          PROBE_DATES: ${{ inputs.date }}
        run: |
          set +e
          echo "::group::csair auth"
          ./csair auth -v
          auth_rc=$?
          echo "auth_exit=$auth_rc"
          echo "::endgroup::"

          FROM="${PROBE_FROM:-SFO}"
          TO="${PROBE_TO:-CAN}"
          DATES="$PROBE_DATES"
          [ -n "$DATES" ] || DATES="$(date -u -d '+21 days' +%F)"

          if [ "$auth_rc" -eq 0 ]; then
            for DATE in ${DATES//,/ }; do
              echo "::group::csair search $FROM $TO $DATE"
              ./csair search "$FROM" "$TO" "$DATE" --json --no-bootstrap -v > out.json 2> search.err
              search_rc=$?
              echo "search_exit=$search_rc"
              echo "----- stderr -----"; cat search.err
              echo "----- stdout -----"; cat out.json
              echo "::endgroup::"
            done
          else
            echo "auth failed (exit $auth_rc) — runner IP likely walled by the WAF. Skipping search."
          fi

          echo "=========================================="
          echo "VERDICT GUIDE:"
          echo "  auth_exit=0 AND search returns itineraries  -> runner can mint; build monitor.yml"
          echo "  auth_exit=5 / 'blocked' / 'no session cookies' -> use local-cron fallback"
          echo "=========================================="
          exit 0

      - name: Capture site requests
        if: inputs.capture
        env:
          PROBE_FROM: ${{ inputs.from }}
          PROBE_TO: ${{ inputs.to }}
          PROBE_DATES: ${{ inputs.date }}
        run: |
          set +e
          FROM="${PROBE_FROM:-SFO}"
          TO="${PROBE_TO:-CAN}"
          DATES="$PROBE_DATES"
          [ -n "$DATES" ] || DATES="$(date -u -d '+21 days' +%F)"
          for DATE in ${DATES//,/ }; do
            echo "::group::csair debug capture $FROM $TO $DATE"
            ./csair debug capture "$FROM" "$TO" "$DATE" --out "capture/$FROM-$TO-$DATE"
            echo "capture_exit=$?"
            echo "::endgroup::"
          done
          exit 0

      - name: Upload captures
        if: inputs.capture
        uses: actions/upload-artifact@v4
        with:
          name: capture
          path: capture/
          if-no-files-found: warn
