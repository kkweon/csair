# Seat-monitor configuration, read by `csair report` via --config. Single source
# of truth for which routes/dates are watched and where snapshots live. Add a
# [[monitor.targets]] block per route+date.
[monitor]
snapshotDir = "data/monitor"

[[monitor.targets]]
from = "SFO"
to   = "CAN"
date = "2026-06-10"

[[monitor.targets]]
from = "SFO"
to   = "CAN"
date = "2026-06-14"

[[monitor.targets]]
from = "SFO"
to   = "CAN"
date = "2026-06-16"
flights = ["CZ660"]   # 1-stop through-flight SFO–WUH–CAN; tracked by flight key

[[monitor.targets]]
from = "SFO"
to   = "CAN"
date = "2026-06-17"   # nonstop CZ658 (default nonstop-only filter)

[[monitor.targets]]
from = "CAN"
to   = "SFO"
date = "2026-08-03"
flights = ["CZ659"]   # 1-stop through-flight CAN–WUH–SFO; tracked by flight key

[[monitor.targets]]
from = "CAN"
to   = "SFO"
date = "2026-08-04"   # nonstop CZ657 (23:20 dep), CAN→SFO return of CZ658

[[monitor.targets]]
from = "CAN"
to   = "SFO"
date = "2026-08-06"
flights = ["CZ659"]   # 1-stop through-flight CAN–WUH–SFO (19:20 dep); tracked by flight key

# Parents-in-law arrival (CAN→SFO): 10/05 per Jia; 10/06 is the standby fallback.
# CZ659 is a CAN–WUH–SFO through-flight, but a CAN→SFO query on its days
# returns "result.data为null", so watch each leg separately.
[[monitor.targets]]
from = "CAN"
to   = "WUH"
date = "2026-10-05"
flights = ["CZ659"]   # leg 1, CAN 19:20 → WUH 21:05

[[monitor.targets]]
from = "WUH"
to   = "SFO"
date = "2026-10-05"
flights = ["CZ659"]   # leg 2, WUH 23:40 → SFO 20:40 PDT

[[monitor.targets]]
from = "CAN"
to   = "SFO"
date = "2026-10-06"   # nonstop CZ657 (23:20 dep) — fallback if 10/05 standby doesn't clear
